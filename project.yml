name: MotionNote
options:
  bundleIdPrefix: com.motionnote
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
targets:
  MotionNote:
    type: application
    platform: iOS
    sources:
      - path: MotionNote
        excludes:
          - Resources
      - path: MotionNote/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.motionnote.personal
        DEVELOPMENT_TEAM: L83UYHTXS2
        INFOPLIST_KEY_CFBundleDisplayName: Motion Note
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 用于训练中的语音指令和私教课记录。
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: 用于将私教课语音整理为训练计划。
        INFOPLIST_KEY_NSHealthShareUsageDescription: 用于读取你的训练、活动能量与心率数据。
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: 用于保存 Motion Note 生成的训练记录。
        OTHER_LDFLAGS: $(inherited) -framework CoreServices -framework WebKit
    entitlements:
      path: MotionNote/MotionNote.entitlements
      properties:
        com.apple.developer.healthkit: true
    info:
      path: MotionNote/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
